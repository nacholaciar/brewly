name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run data:sync
      - run: bun run build
        env:
          SITE_URL: https://brewly.nacholaciar.workers.dev
          PUBLIC_REPOSITORY_URL: https://github.com/nacholaciar/brewly
      - run: bun run deploy:dry-run
